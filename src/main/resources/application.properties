# Jackson configuration
quarkus.jackson.write-dates-as-timestamps=false
quarkus.arc.remove-unused-beans=false

# Nome e Grupo de Recursos
quarkus.azure-functions.app-name=${AZURE_FUNCTION_APP_NAME:avaliacoes-func}
quarkus.azure-functions.resource-group=${AZURE_RESOURCE_GROUP:resource-group-east-us}

# Configurações de Runtime
quarkus.azure-functions.runtime.os=linux
quarkus.azure-functions.runtime.java-version=21

# Configurações de banco de dados
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}

# Opcional: Permite que o Hibernate crie as tabelas automaticamente
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# Configurações de email
quarkus.mailer.host=smtp.gmail.com
quarkus.mailer.port=587
quarkus.mailer.start-tls=REQUIRED

# O seu e-mail do Gmail
quarkus.mailer.username=${EMAIL_USERNAME:mateusgarcia2001@gmail.com}

# A Senha de Aplicação de 16 letras que gerou no Passo 1 (SEM espaços)
# NOTA: Veja a recomendação de segurança abaixo antes de comitar isto!
quarkus.mailer.password=${GMAIL_APP_PASSWORD}

# O remetente (no caso do Gmail, tem de ser obrigatoriamente o mesmo e-mail do username)
quarkus.mailer.from=${EMAIL_FROM:mateusgarcia2001@gmail.com}


admin.email=${ADMIN_EMAIL:mateusgarcia2001@gmail.com}

